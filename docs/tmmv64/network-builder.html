  html, body { margin: 0; height: 100%; background: transparent; color: #1d1d1f; font: 400 20px "Source Sans 3", sans-serif; overflow: hidden; user-select: none; -webkit-user-select: none; }
  #app { position: absolute; left: 0; top: 0; width: 1280px; height: 600px; transform-origin: 0 0; }
  #stage { position: absolute; left: 0; top: 0; width: 790px; height: 600px; touch-action: none; }
  #side { position: absolute; left: 812px; top: 4px; width: 460px; }
  #plot { width: 460px; height: 345px; display: block; border: 1px solid #c9c5bb; border-radius: 6px; background: #fff; }
  #score { margin-top: 10px; font-size: 30px; font-weight: 700; }
  #score .n { color: #6a3d9a; }
  #sub { font-size: 19px; color: #6b6e73; min-height: 26px; }
  #bar { height: 8px; background: #e6e3dc; border-radius: 4px; margin: 6px 0 8px; overflow: hidden; }
  #bar > div { height: 100%; width: 0; background: #6a3d9a; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 6px; }
  button { font: inherit; font-size: 19px; padding: 4px 14px; border: 1px solid #6a3d9a; color: #6a3d9a; background: #fff; border-radius: 6px; cursor: pointer; }
  button.on { background: #6a3d9a; color: #fff; }
  #best { font-size: 19px; color: #1d1d1f; }
  body.phone { overflow-y: auto; }
  body.phone #app { position: static; width: auto; height: auto; transform: none !important; padding: 8px 10px 30px; }
  body.phone #stage { position: relative; display: block; width: 100%; height: auto; aspect-ratio: 790 / 600; }
  body.phone #side { position: static; width: 100%; margin-top: 6px; }
  body.phone #plot { width: 100%; height: auto; aspect-ratio: 4 / 3; }
  body.phone #score { font-size: 26px; }
  html.phone { overflow: auto; height: auto; }   /* phones: the whole page scrolls */

<script>/* Contest bar for the interactive pages used as classroom contests (lecture 5 classifier contest, lecture 6 network
   builder). Shown only when a page is opened on its own (a phone after the QR code), never inside the slides.
   The student types the LiU ID and presses Start; a countdown runs; the page reports finished results with
   Contest.record(); the bar keeps the best one; Submit sends it to the course's contest service (a Cloudflare
   Worker, tools/contest-service/worker.js), which feeds the live leaderboard page. The check code is the one the
   service checks: (score * 7919 + 48611) mod 99991. Inlined into a page by the build scripts at the placeholder of
   the same name. */
window.Contest = (function () {
  const SERVICE = "https://tmmv64-contest.salehi144.workers.dev";
  const code = (score) => String((Math.round(score) * 7919 + 48611) % 99991);
  const ID = /^[a-z]{4,6}[0-9]{2,3}$/;
  let onEnd = null, onStart = null, name = "", seconds = 180, left = 0, state = "idle", best = null, timer = null, el = null;
  let liuid = "", sent = null, msg = "", veil = null;
  try { liuid = localStorage.getItem("tmmv64-liuid") || ""; } catch (e) { /* private window */ }
  const framed = (() => { try { return window.self !== window.top; } catch (e) { return true; } })();
  const mmss = (s) => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
  function render() {
    if (!el) return;
    let h = "";
    if (state === "idle") {
      h = `<div class="ct-row"><b>Contest</b> · ${mmss(seconds)}</div>
        <div class="ct-row"><input id="ct-id" placeholder="LiU ID, e.g. abcde123" value="${liuid}" autocapitalize="off" autocomplete="off" spellcheck="false"> <button id="ct-start">Start</button></div>
        <div class="ct-msg">${msg}</div>`;
    } else {
      const head = state === "running" ? `<b>Time left ${mmss(left)}</b> · ${liuid}` : `<b>Time is up.</b> Submit your best now`;
      const b = best ? `Your best: <b>${best.score} %</b> · ${best.method}` : "Train a model to get a test score";
      const done = sent && best && sent.score === best.score && sent.method === best.method;
      h = `<div class="ct-row">${head}</div><div class="ct-row">${b}</div>
        <div class="ct-row"><button id="ct-send" ${best && !done ? "" : "disabled"}>${done ? "Submitted ✓" : "Submit my best"}</button></div>
        <div class="ct-msg">${msg}</div>`;
    }
    el.innerHTML = h;
    if (veil) { veil.style.display = state === "running" ? "none" : "flex"; veil.textContent = state === "over" ? "Time is up. Submit your best" : "Type your LiU ID and press Start"; }
    const st = el.querySelector("#ct-start"); if (st) st.onclick = start;
    const sd = el.querySelector("#ct-send"); if (sd) sd.onclick = send;
    const inp = el.querySelector("#ct-id"); if (inp) inp.onkeydown = (e) => { if (e.key === "Enter") start(); };
  }
  function start() {
    const v = (el.querySelector("#ct-id").value || "").trim().toLowerCase();
    if (!ID.test(v)) { msg = "Type your LiU ID, letters then digits, like abcde123"; render(); return; }
    liuid = v; msg = ""; try { localStorage.setItem("tmmv64-liuid", liuid); } catch (e) { /* private window */ }
    state = "running"; left = seconds; best = null; sent = null; render(); if (onStart) onStart();   // count the model already on screen
    timer = setInterval(() => { left--; if (left <= 0) { clearInterval(timer); state = "over"; if (onEnd) onEnd(); } render(); }, 1000);
  }
  async function send() {
    if (!best) return;
    const r = { contest: name, liuid, method: best.method, score: best.score, size: best.size, code: code(best.score) };
    msg = "Sending …"; render();
    try {
      const res = await fetch(SERVICE + "/submit", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(r) });
      const j = await res.json();
      if (j.ok) { sent = { score: best.score, method: best.method }; msg = "On the leaderboard. A better result can be submitted again"; }
      else msg = "Not accepted: " + (j.error || res.status);
    } catch (e) { msg = "No connection. Try again"; }
    render();
  }
  function init(opt) {
    if (framed) return;
    name = opt.name; seconds = opt.seconds || 180; onStart = opt.onStart || null; onEnd = opt.onEnd || null;
    const css = document.createElement("style");
    css.textContent = `#ct { position: fixed; z-index: 50; right: 10px; bottom: 10px; width: 340px; background: #fff; border: 2px solid #9c6a12; border-radius: 10px;
      padding: 8px 12px; font: 400 17px "Source Sans 3", sans-serif; color: #1d1d1f; box-shadow: 0 6px 20px rgba(0,0,0,0.18); }
      #ct .ct-row { margin: 4px 0; } #ct .ct-note { margin-top: 6px; font-size: 13px; color: #6b6e73; } #ct .ct-msg { font-size: 14px; color: #9c6a12; }
      #ct input { font: inherit; font-size: 17px; width: 190px; padding: 4px 8px; border: 1px solid #9c6a12; border-radius: 6px; }
      #ct button { font: inherit; font-size: 17px; padding: 4px 12px; border: 1px solid #9c6a12; color: #fff; background: #9c6a12; border-radius: 6px; cursor: pointer; }
      #ct button:disabled { opacity: 0.45; cursor: default; }
      body.phone #ct { position: sticky; top: 0; bottom: auto; right: auto; width: auto; margin: 0 0 8px; font-size: 18px; }
      body.phone #ct input { width: 60%; }
      #ct-veil { position: fixed; inset: 0; z-index: 40; display: flex; align-items: center; justify-content: center; background: rgba(247,246,242,0.82);
        font: 700 26px "Source Sans 3", sans-serif; color: #9c6a12; text-align: center; padding: 20px; }`;
    document.head.appendChild(css);
    el = document.createElement("div"); el.id = "ct"; document.body.insertBefore(el, document.body.firstChild);
    if (opt.veil) {                                  // pages without their own lock: a cover that blocks play until Start
      veil = document.createElement("div"); veil.id = "ct-veil"; document.body.appendChild(veil);
    }
    render();
  }
  function record(score, method, size) {            // a finished result; ties go to the smaller size (simpler model)
    if (state !== "running") return;
    if (!best || score > best.score || (score === best.score && size !== undefined && size < best.size)) { best = { score, method, size }; render(); }
  }
  return { init, record, code, running: () => state === "running", framed };
})();
</script>

    g.fillStyle = INK; g.font = "19px 'Source Sans 3'"; g.textAlign = "left"; g.fillText("Drop beside a layer to join it,", TRAYN[0] + 36, TRAYN[1] - 4);
    g.fillStyle = MUTED; g.font = "16px 'Source Sans 3'"; g.fillText("between layers for a new one. Tap twice to remove", TRAYN[0] + 36, TRAYN[1] + 18);

  // ---------------------------------------------------------------- the network and training

    if (done) {

      $("sub").textContent = `Layers ${archText()} · training points ${pct(meanAcc(D.train)).toFixed(1)} % · mean of ${STARTS} starts`;
    } else {
      $("score").innerHTML = `Training … <span class="n">${nn}</span>`;
      $("sub").textContent = `Layers ${archText()} · start ${start + 1} of ${STARTS}`;
    }
    $("bar").firstChild.style.width = `${100 * (done ? 1 : (start + steps / STEPS) / STARTS)}%`;

  }

/* Labels of the animations in the slides' style (Saeed's rules, as slidestyle.py does for figures): numbers,
   variables and Greek letters in the KaTeX fonts like the slide maths, and every label starting with a capital.
   animkit.write puts this script and the KaTeX fonts into every animation page; it tidies the page as it is drawn
   (a MutationObserver), so labels the animation rewrites every frame are tidied too. Code, form fields and
   text already in KaTeX fonts are left alone. */
(function () {
  const SKIP = /^(SCRIPT|STYLE|TEXTAREA|INPUT|PRE|CODE|SELECT)$/;
  const FUNCS = /^(cos|sin|tan|ln|log|exp|arg|max|min|tanh|det|diag|Re|Im)$/;
  const VAR = "[A-Za-zα-ωΑ-ΩϑϕϵΔΣ]\\u0304?(?:[\\u2080-\\u2089\\u2090-\\u209c\\u1d62-\\u1d6a\\u2c7c]+)?(?:[\\u00b2\\u00b3\\u00b9\\u2070-\\u2079\\u1d43-\\u1d5b\\u02b0-\\u02b8\\u2071\\u207f]+)?";
  const NUM = "[-\\u2212]?\\d+(?:[.,]\\d+)*(?:[\\u2070-\\u2079\\u207b]+)?";
  const OP = "[=\\u00d7\\u2248\\u2212+\\u00b7/<>\\u2264\\u2265|()]";
  const WORD = new RegExp(`^(?:${NUM}|${VAR}|${OP}|${VAR}${OP}?${NUM}|\\|${VAR}\\||${OP}+)$`);
  const GREEK_OR_VAR = new RegExp(`^${VAR}$`);
  const mathWord = (w) => {
    if (!WORD.test(w)) return false;
    if (/^[aA]$/.test(w)) return false;                       // the article "a", not a variable
    return true;
  };
  const UNITS = /^(W|K|N|J|V|s|h|g|m|A|Hz|Pa|kW|MW|mm|cm|km)$/;
  const isMono = (el) => /mono|courier/i.test(getComputedStyle(el).fontFamily);
  const isKatex = (el) => /KaTeX/.test(getComputedStyle(el).fontFamily);
  const svgNS = "http://www.w3.org/2000/svg";

  function piece(inSvg, text, italic) {
    const n = inSvg ? document.createElementNS(svgNS, "tspan") : document.createElement("span");
    n.setAttribute("class", "km");
    if (inSvg) {
      n.setAttribute("font-family", italic ? "KaTeX_Math, serif" : "KaTeX_Main, serif");
      if (italic) n.setAttribute("font-style", "italic");
    } else {
      n.style.fontFamily = italic ? "KaTeX_Math, serif" : "KaTeX_Main, serif";
      if (italic) n.style.fontStyle = "italic";
    }
    n.textContent = text;
    return n;
  }

  /* the first text of a label: the nearest SVG text element or block-level HTML element */
  function labelOf(node) {
    let el = node.parentElement;
    while (el && el !== document.body) {
      if (el.namespaceURI === svgNS) { if (el.tagName === "text") return el; }
      else if (getComputedStyle(el).display !== "inline") return el;
      el = el.parentElement;
    }
    return el;
  }
  /* an SVG line that continues the line above it (same x, just below): no capital */
  function continues(label) {
    if (!label || label.tagName !== "text") return false;
    if (!/^\s*(the|from|of|and|with|in|on|at|to|for|by|an?|or|than|into|per)\b/.test(label.textContent)) return false;
    const x = label.getAttribute("x"), y = parseFloat(label.getAttribute("y"));
    const fs = parseFloat(getComputedStyle(label).fontSize) || 16;
    for (let e = label.previousElementSibling, n = 0; e && n < 4; e = e.previousElementSibling, n++) {
      if (e.tagName !== "text" || e.getAttribute("x") !== x) continue;
      const dy = y - parseFloat(e.getAttribute("y"));
      if (dy > 0 && dy < 2.2 * fs) return !/[.!?]\s*$/.test(e.textContent);
    }
    return false;
  }
  function firstText(label) {
    const w = document.createTreeWalker(label, NodeFilter.SHOW_TEXT);
    for (let t = w.nextNode(); t; t = w.nextNode()) if (t.data.trim()) return t;
    return null;
  }

  function tidyText(t) {
    const p = t.parentElement;
    if (!p || SKIP.test(p.tagName) || p.closest(".km, pre, code, textarea, select, [data-raw]")) return;
    if (isMono(p) || isKatex(p)) return;
    let s = t.data;
    const label = labelOf(t);
    if (label && firstText(label) === t && !continues(label)) {                    // a capital first letter
      const m = s.match(/^(\s*)([a-z])([a-z]+)\b/);
      if (m && !FUNCS.test(m[2] + m[3]) && m[2] + m[3] !== "kNN") s = m[1] + m[2].toUpperCase() + s.slice(m[1].length + 1);
    }
    const words = s.split(/(\s+)/);
    if (!words.some((w) => w.trim() && mathWord(w.replace(/[,;:%°]+$/, "")))) {
      if (s !== t.data) t.data = s;
      return;
    }
    const inSvg = p.namespaceURI === svgNS;
    const frag = document.createDocumentFragment();
    let plain = "";
    const flush = () => { if (plain) { frag.appendChild(document.createTextNode(plain)); plain = ""; } };
    let prevNum = false;
    for (const w of words) {
      const core = w.replace(/[,;:%°]+$/, ""), tail = w.slice(core.length);
      const unit = prevNum && UNITS.test(core);               // "0.0 W", "3 s": a unit, upright text
      if (w.trim()) prevNum = new RegExp(`^${NUM}$`).test(core);
      if (w.trim() && core && mathWord(core) && !unit) {
        flush();
        /* letters italic (KaTeX_Math), the rest upright (KaTeX_Main) */
        for (const part of core.split(new RegExp(`(${VAR})`)).filter(Boolean)) {
          const letter = GREEK_OR_VAR.test(part) && !/^(Re|Im)$/.test(part);
          frag.appendChild(piece(inSvg, part, letter));
        }
        plain += tail;
      } else plain += w;
    }
    flush();
    p.replaceChild(frag, t);
  }

  function tidy(root) {
    const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
    const list = [];
    for (let t = w.nextNode(); t; t = w.nextNode()) if (t.data.trim()) list.push(t);
    list.forEach(tidyText);
  }

  let busy = false;
  const obs = new MutationObserver(() => {
    if (busy) return;
    busy = true; obs.disconnect();
    try { tidy(document.body); } finally {
      obs.observe(document.body, { childList: true, subtree: true, characterData: true });
      busy = false;
    }
  });
  const start = () => { tidy(document.body); obs.observe(document.body, { childList: true, subtree: true, characterData: true }); };
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", start); else start();
})();
