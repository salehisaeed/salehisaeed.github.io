# Checks the committed build in docs/ on every push and pull request.
# It does not render the site: Quarto output depends on the Quarto version,
# so rendering in CI would report differences that are not real problems.
name: Check site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyyaml
      - run: python3 scripts/check_site.py
