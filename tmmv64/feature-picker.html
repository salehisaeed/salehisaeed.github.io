  html, body { margin: 0; height: 100%; background: transparent; color: #1d1d1f; overflow: hidden;
               font: 400 22px "Source Sans 3", "Segoe UI", Arial, sans-serif; user-select: none; }
  #app { position: absolute; left: 0; top: 0; width: 1200px; height: 540px; transform-origin: 0 0; }
  svg { position: absolute; left: 0; top: 0; width: 1200px; height: 540px; }
  #ctl { position: absolute; left: 640px; top: 10px; width: 550px; display: flex; flex-direction: column; gap: 8px; }
  .row { display: flex; gap: 6px; }
  .mode { width: 60px; text-align: center; cursor: pointer; font-family: KaTeX_Main, serif; font-size: 17px; color: #6b6e73; }
  .mode img { width: 56px; height: 56px; image-rendering: pixelated; border: 3px solid transparent; border-radius: 4px; display: block; margin: 0 auto; }
  .mode.on img { border-color: #1d5a85; }
  .mode.on { color: #1d5a85; font-weight: 600; }
  .muted { color: #6b6e73; font-size: 18px; }
  .big { font-family: KaTeX_Main, serif; font-size: 26px; font-weight: 600; }
  button { font: inherit; font-size: 20px; padding: 3px 10px; border: 1px solid #1d5a85; color: #1d5a85; background: #fff; border-radius: 6px; cursor: pointer; }
  /* phones held upright: the plot scaled to the width, the mode pictures below at their own size */
  body.phone { overflow: auto; height: auto; background: #fff; font-size: 19px; }
  .phone #app { position: static; width: auto; height: auto; transform: none !important; padding: 8px; }
  .phone svg { position: static; display: block; width: 100%; height: auto; }
  .phone #ctl { position: static; width: auto; margin: 4px 0; }
  .phone .row { flex-wrap: wrap; }
  .phone .mode { width: 22%; }
  .phone .mode img { width: 64px; height: 64px; }
</style>
</head>

  <svg id="v" viewBox="0 0 1200 540"></svg>

  const $ = (id) => document.getElementById(id);
  const DW = 1200, DH = 540;
  const framed0 = (() => { try { return window.self !== window.top; } catch (e) { return true; } })();
  const phone = !framed0 && Math.min(screen.width || 9999, innerWidth) < 700 && screen.height > screen.width;
  if (phone) { document.body.classList.add("phone"); $("v").setAttribute("viewBox", "0 0 620 540"); }
  function fit() { if (phone) return; const s = Math.min(innerWidth / DW, innerHeight / DH); $("app").style.transform = `translate(${(innerWidth - DW * s) / 2}px, 0) scale(${s})`; }
  window.addEventListener("resize", fit); fit();
  const INK = "#1d1d1f", MUTED = "#6b6e73", DOG = "#0072B2", CAT = "#E0162B", ME = "#009E73", DDOG = "#003f62", DCAT = "#7b0c18";
  let mx = 0, my = 3, me = false;
  const R = { x: 70, y: 14, w: 520, h: 460 }, lim = 3.4;
  const sx = (v) => R.x + R.w * (Math.max(-lim, Math.min(lim, v)) + lim) / (2 * lim);
  const sy = (v) => R.y + R.h * (1 - (Math.max(-lim, Math.min(lim, v)) + lim) / (2 * lim));
  const f = (v) => (Math.round(v * 10) / 10).toString();
  for (const [id, set] of [["rx", (k) => { mx = k; }], ["ry", (k) => { my = k; }]]) {
    D.modes.forEach((src, k) => {
      const d = document.createElement("div"); d.className = "mode"; d.innerHTML = `<img src="${src}" alt="mode ${k}">${k}`;
      d.onclick = () => { set(k); draw(); }; $(id).appendChild(d);
    });
  }
  function separation() {
    const P = D.dog.map((r) => [r[mx], r[my], 0]).concat(D.cat.map((r) => [r[mx], r[my], 1]));
    let ok = 0;
    for (let i = 0; i < P.length; i++) {
      const d = [];
      for (let j = 0; j < P.length; j++) if (j !== i) d.push([(P[i][0] - P[j][0]) ** 2 + (P[i][1] - P[j][1]) ** 2, P[j][2]]);
      d.sort((a, b) => a[0] - b[0]);
      const same = d.slice(0, 5).filter((q) => q[1] === P[i][2]).length;
      if (same >= 3) ok++;
    }
    return ok / P.length;
  }
  function draw() {
    [...$("rx").children].forEach((c, k) => c.classList.toggle("on", k === mx));
    [...$("ry").children].forEach((c, k) => c.classList.toggle("on", k === my));
    $("xt").textContent = mx; $("yt").textContent = my;
    const o = [`<rect x="${R.x}" y="${R.y}" width="${R.w}" height="${R.h}" fill="#fff" stroke="#c9c7c0"/>`];
    o.push(`<line x1="${f(sx(0))}" x2="${f(sx(0))}" y1="${R.y}" y2="${R.y + R.h}" stroke="#e6e4de"/><line y1="${f(sy(0))}" y2="${f(sy(0))}" x1="${R.x}" x2="${R.x + R.w}" stroke="#e6e4de"/>`);
    for (const r of D.dog) o.push(`<circle cx="${f(sx(r[mx]))}" cy="${f(sy(r[my]))}" r="6" fill="${DOG}" stroke="${DDOG}" stroke-width="1.2" opacity="0.9"/>`);
    for (const r of D.cat) o.push(`<rect x="${f(sx(r[mx]) - 5.5)}" y="${f(sy(r[my]) - 5.5)}" width="11" height="11" fill="${CAT}" stroke="${DCAT}" stroke-width="1.2" opacity="0.9"/>`);
    if (me) for (const r of D.face) o.push(`<text x="${f(sx(r[mx]))}" y="${f(sy(r[my]) + 7)}" text-anchor="middle" font-size="20" fill="${ME}" stroke="${INK}" stroke-width="0.6">★</text>`);
    o.push(`<text x="${R.x + R.w / 2}" y="${R.y + R.h + 30}" text-anchor="middle" font-size="20" fill="${INK}">Mode ${mx}</text>`);
    o.push(`<text x="${R.x - 22}" y="${R.y + R.h / 2}" text-anchor="middle" font-size="20" fill="${INK}" transform="rotate(-90 ${R.x - 22} ${R.y + R.h / 2})">Mode ${my}</text>`);
    const ly = R.y + R.h + 56;
    o.push(`<circle cx="${R.x + 120}" cy="${ly - 6}" r="6" fill="${DOG}" stroke="${DDOG}"/><text x="${R.x + 132}" y="${ly}" font-size="19" fill="${INK}">Dogs</text>`);
    o.push(`<rect x="${R.x + 214}" y="${ly - 11.5}" width="11" height="11" fill="${CAT}" stroke="${DCAT}"/><text x="${R.x + 232}" y="${ly}" font-size="19" fill="${INK}">Cats</text>`);
    if (me) o.push(`<text x="${R.x + 316}" y="${ly + 1}" font-size="20" fill="${ME}" stroke="${INK}" stroke-width="0.6">★</text><text x="${R.x + 338}" y="${ly}" font-size="19" fill="${INK}">Saeed</text>`);
    $("v").innerHTML = o.join("");
  }
  window.pick = (a, b, s) => { mx = a; my = b; me = !!s; draw(); };
  draw();
})();

/* Labels of the animations in the slides' style (Saeed's rules, as slidestyle.py does for figures): numbers,
   variables and Greek letters in the KaTeX fonts like the slide maths, and every label starting with a capital.
   animkit.write puts this script and the KaTeX fonts into every animation page; it tidies the page as it is drawn
   (a MutationObserver), so labels the animation rewrites every frame are tidied too. Code, form fields and
   text already in KaTeX fonts are left alone. */
(function () {
  const SKIP = /^(SCRIPT|STYLE|TEXTAREA|INPUT|PRE|CODE|SELECT)$/;
  const FUNCS = /^(cos|sin|tan|ln|log|exp|arg|max|min|tanh|det|diag|Re|Im)$/;
  const VAR = "[A-Za-zα-ωΑ-ΩϑϕϵΔΣ]\\u0304?(?:[\\u2080-\\u2089\\u2090-\\u209c\\u1d62-\\u1d6a\\u2c7c]+)?(?:[\\u00b2\\u00b3\\u00b9\\u2070-\\u2079\\u1d43-\\u1d5b\\u02b0-\\u02b8\\u2071\\u207f]+)?";
  const NUM = "[-\\u2212]?\\d+(?:[.,]\\d+)*(?:[\\u2070-\\u2079\\u207b]+)?";
  const OP = "[=\\u00d7\\u2248\\u2212+\\u00b7/<>\\u2264\\u2265|()]";
  const WORD = new RegExp(`^(?:${NUM}|${VAR}|${OP}|${VAR}${OP}?${NUM}|\\|${VAR}\\||${OP}+)$`);
  const GREEK_OR_VAR = new RegExp(`^${VAR}$`);
  const mathWord = (w) => {
    if (!WORD.test(w)) return false;
    if (/^[aA]$/.test(w)) return false;                       // the article "a", not a variable
    return true;
  };
  const UNITS = /^(W|K|N|J|V|s|h|g|m|A|Hz|Pa|kW|MW|mm|cm|km)$/;
  const isMono = (el) => /mono|courier/i.test(getComputedStyle(el).fontFamily);
  const isKatex = (el) => /KaTeX/.test(getComputedStyle(el).fontFamily);
  const svgNS = "http://www.w3.org/2000/svg";

  function piece(inSvg, text, italic) {
    const n = inSvg ? document.createElementNS(svgNS, "tspan") : document.createElement("span");
    n.setAttribute("class", "km");
    if (inSvg) {
      n.setAttribute("font-family", italic ? "KaTeX_Math, serif" : "KaTeX_Main, serif");
      if (italic) n.setAttribute("font-style", "italic");
    } else {
      n.style.fontFamily = italic ? "KaTeX_Math, serif" : "KaTeX_Main, serif";
      if (italic) n.style.fontStyle = "italic";
    }
    n.textContent = text;
    return n;
  }

  /* the first text of a label: the nearest SVG text element or block-level HTML element */
  function labelOf(node) {
    let el = node.parentElement;
    while (el && el !== document.body) {
      if (el.namespaceURI === svgNS) { if (el.tagName === "text") return el; }
      else if (getComputedStyle(el).display !== "inline") return el;
      el = el.parentElement;
    }
    return el;
  }
  /* an SVG line that continues the line above it (same x, just below): no capital */
  function continues(label) {
    if (!label || label.tagName !== "text") return false;
    if (!/^\s*(the|from|of|and|with|in|on|at|to|for|by|an?|or|than|into|per)\b/.test(label.textContent)) return false;
    const x = label.getAttribute("x"), y = parseFloat(label.getAttribute("y"));
    const fs = parseFloat(getComputedStyle(label).fontSize) || 16;
    for (let e = label.previousElementSibling, n = 0; e && n < 4; e = e.previousElementSibling, n++) {
      if (e.tagName !== "text" || e.getAttribute("x") !== x) continue;
      const dy = y - parseFloat(e.getAttribute("y"));
      if (dy > 0 && dy < 2.2 * fs) return !/[.!?]\s*$/.test(e.textContent);
    }
    return false;
  }
  function firstText(label) {
    const w = document.createTreeWalker(label, NodeFilter.SHOW_TEXT);
    for (let t = w.nextNode(); t; t = w.nextNode()) if (t.data.trim()) return t;
    return null;
  }

  function tidyText(t) {
    const p = t.parentElement;
    if (!p || SKIP.test(p.tagName) || p.closest(".km, pre, code, textarea, select, [data-raw]")) return;
    if (isMono(p) || isKatex(p)) return;
    let s = t.data;
    const label = labelOf(t);
    if (label && firstText(label) === t && !continues(label)) {                    // a capital first letter
      const m = s.match(/^(\s*)([a-z])([a-z]+)\b/);
      if (m && !FUNCS.test(m[2] + m[3]) && m[2] + m[3] !== "kNN") s = m[1] + m[2].toUpperCase() + s.slice(m[1].length + 1);
    }
    const words = s.split(/(\s+)/);
    if (!words.some((w) => w.trim() && mathWord(w.replace(/[,;:%°]+$/, "")))) {
      if (s !== t.data) t.data = s;
      return;
    }
    const inSvg = p.namespaceURI === svgNS;
    const frag = document.createDocumentFragment();
    let plain = "";
    const flush = () => { if (plain) { frag.appendChild(document.createTextNode(plain)); plain = ""; } };
    let prevNum = false;
    for (const w of words) {
      const core = w.replace(/[,;:%°]+$/, ""), tail = w.slice(core.length);
      const unit = prevNum && UNITS.test(core);               // "0.0 W", "3 s": a unit, upright text
      if (w.trim()) prevNum = new RegExp(`^${NUM}$`).test(core);
      if (w.trim() && core && mathWord(core) && !unit) {
        flush();
        /* letters italic (KaTeX_Math), the rest upright (KaTeX_Main) */
        for (const part of core.split(new RegExp(`(${VAR})`)).filter(Boolean)) {
          const letter = GREEK_OR_VAR.test(part) && !/^(Re|Im)$/.test(part);
          frag.appendChild(piece(inSvg, part, letter));
        }
        plain += tail;
      } else plain += w;
    }
    flush();
    p.replaceChild(frag, t);
  }

  function tidy(root) {
    const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
    const list = [];
    for (let t = w.nextNode(); t; t = w.nextNode()) if (t.data.trim()) list.push(t);
    list.forEach(tidyText);
  }

  let busy = false;
  const obs = new MutationObserver(() => {
    if (busy) return;
    busy = true; obs.disconnect();
    try { tidy(document.body); } finally {
      obs.observe(document.body, { childList: true, subtree: true, characterData: true });
      busy = false;
    }
  });
  const start = () => { tidy(document.body); obs.observe(document.body, { childList: true, subtree: true, characterData: true }); };
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", start); else start();
})();
