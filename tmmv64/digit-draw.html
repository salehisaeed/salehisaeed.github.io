  txt(900, 40, "10 outputs (softmax)", { fill: INK, "font-size": 20 });
  const HID = { x: 610, y: 120, s: 30 }, hid = [];
  for (let k = 0; k < 64; k++) hid.push(el("rect", { x: HID.x + (k % 8) * HID.s, y: HID.y + Math.floor(k / 8) * HID.s, width: HID.s - 3, height: HID.s - 3, rx: 3, fill: "#f1efe9", stroke: "#c9c6bd", "stroke-width": 0.8 }));
  for (let a = 0; a < 5; a++) for (let b = 0; b < 5; b++)   // a hint of the many connections
    el("line", { x1: 552, y1: 175 + 32 * a, x2: 606, y2: 128 + 58 * b, stroke: "#cfcbc2", "stroke-width": 0.7 });
  const OUTB = { x: 940, y: 70, h: 40, w: 260 }, bars = [], pct = [];
  for (let a = 0; a < 5; a++) for (let b = 0; b < 5; b++)
    el("line", { x1: 854, y1: 128 + 58 * a, x2: 908, y2: 85 + 90 * b, stroke: "#cfcbc2", "stroke-width": 0.7 });
  for (let d = 0; d < 10; d++) {
    const y = OUTB.y + d * OUTB.h;
    el("rect", { x: OUTB.x, y, width: OUTB.w, height: OUTB.h - 10, fill: "#f1efe9", rx: 3 });
    bars.push(el("rect", { x: OUTB.x, y, width: 0, height: OUTB.h - 10, fill: BLUE, rx: 3 }));
    txt(OUTB.x - 26, y + 23, String(d), { fill: INK, "font-family": "KaTeX_Main", "font-size": 22 });
    pct.push(txt(OUTB.x + OUTB.w + 10, y + 22, "", { "font-family": "KaTeX_Main", fill: INK }));
  }
  const verdict = txt(900, 500, "", { fill: INK, "font-size": 24 });

  /* ---------- drawing pad ---------- */
  const pad = $("pad"), g = pad.getContext("2d");
  let drawing = false, last = null;
  function clear() { g.fillStyle = "#fff"; g.fillRect(0, 0, 340, 340); update(); }
  const pos = (e) => { const r = pad.getBoundingClientRect(); return [(e.clientX - r.left) * 340 / r.width, (e.clientY - r.top) * 340 / r.height]; };
  pad.addEventListener("pointerdown", (e) => { drawing = true; last = pos(e); pad.setPointerCapture(e.pointerId); stroke(last); });
  pad.addEventListener("pointermove", (e) => { if (drawing) stroke(pos(e)); });
  pad.addEventListener("pointerup", () => { drawing = false; last = null; update(); });
  function stroke(p) {
    g.strokeStyle = INK; g.lineWidth = 26; g.lineCap = "round"; g.lineJoin = "round";
    g.beginPath(); g.moveTo(...(last || p)); g.lineTo(...p); g.stroke(); last = p;
    update();
  }

  /* ---------- like MNIST: 20 x 20 box, centered by mass in 28 x 28 ---------- */
  function input() {
    const im = g.getImageData(0, 0, 340, 340).data;
    let x0 = 340, x1 = -1, y0 = 340, y1 = -1;
    for (let y = 0; y < 340; y++) for (let x = 0; x < 340; x++) if (im[4 * (y * 340 + x)] < 128) { x0 = Math.min(x0, x); x1 = Math.max(x1, x); y0 = Math.min(y0, y); y1 = Math.max(y1, y); }
    const v = new Float32Array(784);
    if (x1 < 0) return v;
    const w = x1 - x0 + 1, h = y1 - y0 + 1, s = 20 / Math.max(w, h);
    const c = document.createElement("canvas"); c.width = 28; c.height = 28;
    const cg = c.getContext("2d"); cg.fillStyle = "#fff"; cg.fillRect(0, 0, 28, 28);
    cg.imageSmoothingEnabled = true; cg.imageSmoothingQuality = "high";
    cg.drawImage(pad, x0, y0, w, h, 14 - w * s / 2, 14 - h * s / 2, w * s, h * s);
    const d = cg.getImageData(0, 0, 28, 28).data;
    let m = 0, mx = 0, my = 0;
    for (let i = 0; i < 784; i++) { const a = 1 - d[4 * i] / 255; v[i] = a; m += a; mx += a * (i % 28); my += a * Math.floor(i / 28); }
    const dx = Math.round(14 - 0.5 - mx / m), dy = Math.round(14 - 0.5 - my / m), out = new Float32Array(784);
    for (let y = 0; y < 28; y++) for (let x = 0; x < 28; x++) { const X = x - dx, Y = y - dy; if (X >= 0 && X < 28 && Y >= 0 && Y < 28) out[y * 28 + x] = v[Y * 28 + X]; }
    return out;
  }
  function show(v) {
    const sg = $("small").getContext("2d"), img = sg.createImageData(28, 28);
    for (let i = 0; i < 784; i++) { const c = 255 - Math.round(255 * Math.min(1, v[i])); img.data.set([c, c, c, 255], 4 * i); }
    sg.putImageData(img, 0, 0);
    const h = NET.b0.map((b, j) => { let s = b; const w = NET.W0[j]; for (let i = 0; i < 784; i++) s += w[i] * v[i]; return Math.max(0, s); });
    const hm = Math.max(...h, 1e-6);
    h.forEach((a, j) => { const t = a / hm; hid[j].setAttribute("fill", `rgba(0,114,178,${(0.06 + 0.94 * t).toFixed(3)})`); });
    let z = NET.b1.map((b, k) => { let s = b; for (let j = 0; j < 64; j++) s += NET.W1[k][j] * h[j]; return s; });
    const zm = Math.max(...z), e = z.map((u) => Math.exp(u - zm)), S = e.reduce((a, b) => a + b, 0), p = e.map((u) => u / S);
    const empty = v.every((a) => a === 0);
    const best = p.indexOf(Math.max(...p));
    p.forEach((q, d) => { bars[d].setAttribute("width", empty ? 0 : (OUTB.w * q).toFixed(1)); bars[d].setAttribute("fill", d === best ? GREEN : BLUE);
      pct[d].textContent = empty ? "" : (100 * q < 0.5 ? "0" : Math.round(100 * q)) + " %"; });
    verdict.textContent = empty ? "" : `The network says ${best}, with ${Math.round(100 * p[best])} %`;
  }
  function update() { show(input()); }
  let exi = 0;
  function example(k) {
    const v = new Float32Array(EX[k].map((a) => a / 255));
    g.fillStyle = "#fff"; g.fillRect(0, 0, 340, 340);
    const c = document.createElement("canvas"); c.width = 28; c.height = 28; const cg = c.getContext("2d"), img = cg.createImageData(28, 28);
    for (let i = 0; i < 784; i++) { const q = 255 - EX[k][i]; img.data.set([q, q, q, 255], 4 * i); }
    cg.putImageData(img, 0, 0); g.imageSmoothingEnabled = false; g.drawImage(c, 0, 0, 340, 340);
    show(v);
  }
  $("clear").onclick = clear;
  $("example").onclick = () => { example(exi); exi = (exi + 1) % EX.length; };
  clear();
  window.showExample = example;
  window.renderAt = () => {};
})();
</script>

/* Labels of the animations in the slides' style (Saeed's rules, as slidestyle.py does for figures): numbers,
   variables and Greek letters in the KaTeX fonts like the slide maths, and every label starting with a capital.
   animkit.write puts this script and the KaTeX fonts into every animation page; it tidies the page as it is drawn
   (a MutationObserver), so labels the animation rewrites every frame are tidied too. Code, form fields and
   text already in KaTeX fonts are left alone. */
(function () {
  const SKIP = /^(SCRIPT|STYLE|TEXTAREA|INPUT|PRE|CODE|SELECT)$/;
  const FUNCS = /^(cos|sin|tan|ln|log|exp|arg|max|min|tanh|det|diag|Re|Im)$/;
  const VAR = "[A-Za-zα-ωΑ-ΩϑϕϵΔΣ]\\u0304?(?:[\\u2080-\\u2089\\u2090-\\u209c\\u1d62-\\u1d6a\\u2c7c]+)?(?:[\\u00b2\\u00b3\\u00b9\\u2070-\\u2079\\u1d43-\\u1d5b\\u02b0-\\u02b8\\u2071\\u207f]+)?";
  const NUM = "[-\\u2212]?\\d+(?:[.,]\\d+)*(?:[\\u2070-\\u2079\\u207b]+)?";
  const OP = "[=\\u00d7\\u2248\\u2212+\\u00b7/<>\\u2264\\u2265|()]";
  const WORD = new RegExp(`^(?:${NUM}|${VAR}|${OP}|${VAR}${OP}?${NUM}|\\|${VAR}\\||${OP}+)$`);
  const GREEK_OR_VAR = new RegExp(`^${VAR}$`);
  const mathWord = (w) => {
    if (!WORD.test(w)) return false;
    if (/^[aA]$/.test(w)) return false;                       // the article "a", not a variable
    return true;
  };
  const UNITS = /^(W|K|N|J|V|s|h|g|m|A|Hz|Pa|kW|MW|mm|cm|km)$/;
  const isMono = (el) => /mono|courier/i.test(getComputedStyle(el).fontFamily);
  const isKatex = (el) => /KaTeX/.test(getComputedStyle(el).fontFamily);
  const svgNS = "http://www.w3.org/2000/svg";

  function piece(inSvg, text, italic) {
    const n = inSvg ? document.createElementNS(svgNS, "tspan") : document.createElement("span");
    n.setAttribute("class", "km");
    if (inSvg) {
      n.setAttribute("font-family", italic ? "KaTeX_Math, serif" : "KaTeX_Main, serif");
      if (italic) n.setAttribute("font-style", "italic");
    } else {
      n.style.fontFamily = italic ? "KaTeX_Math, serif" : "KaTeX_Main, serif";
      if (italic) n.style.fontStyle = "italic";
    }
    n.textContent = text;
    return n;
  }

  /* the first text of a label: the nearest SVG text element or block-level HTML element */
  function labelOf(node) {
    let el = node.parentElement;
    while (el && el !== document.body) {
      if (el.namespaceURI === svgNS) { if (el.tagName === "text") return el; }
      else if (getComputedStyle(el).display !== "inline") return el;
      el = el.parentElement;
    }
    return el;
  }
  /* an SVG line that continues the line above it (same x, just below): no capital */
  function continues(label) {
    if (!label || label.tagName !== "text") return false;
    if (!/^\s*(the|from|of|and|with|in|on|at|to|for|by|an?|or|than|into|per)\b/.test(label.textContent)) return false;
    const x = label.getAttribute("x"), y = parseFloat(label.getAttribute("y"));
    const fs = parseFloat(getComputedStyle(label).fontSize) || 16;
    for (let e = label.previousElementSibling, n = 0; e && n < 4; e = e.previousElementSibling, n++) {
      if (e.tagName !== "text" || e.getAttribute("x") !== x) continue;
      const dy = y - parseFloat(e.getAttribute("y"));
      if (dy > 0 && dy < 2.2 * fs) return !/[.!?]\s*$/.test(e.textContent);
    }
    return false;
  }
  function firstText(label) {
    const w = document.createTreeWalker(label, NodeFilter.SHOW_TEXT);
    for (let t = w.nextNode(); t; t = w.nextNode()) if (t.data.trim()) return t;
    return null;
  }

  function tidyText(t) {
    const p = t.parentElement;
    if (!p || SKIP.test(p.tagName) || p.closest(".km, pre, code, textarea, select, [data-raw]")) return;
    if (isMono(p) || isKatex(p)) return;
    let s = t.data;
    const label = labelOf(t);
    if (label && firstText(label) === t && !continues(label)) {                    // a capital first letter
      const m = s.match(/^(\s*)([a-z])([a-z]+)\b/);
      if (m && !FUNCS.test(m[2] + m[3]) && m[2] + m[3] !== "kNN") s = m[1] + m[2].toUpperCase() + s.slice(m[1].length + 1);
    }
    const words = s.split(/(\s+)/);
    if (!words.some((w) => w.trim() && mathWord(w.replace(/[,;:%°]+$/, "")))) {
      if (s !== t.data) t.data = s;
      return;
    }
    const inSvg = p.namespaceURI === svgNS;
    const frag = document.createDocumentFragment();
    let plain = "";
    const flush = () => { if (plain) { frag.appendChild(document.createTextNode(plain)); plain = ""; } };
    let prevNum = false;
    for (const w of words) {
      const core = w.replace(/[,;:%°]+$/, ""), tail = w.slice(core.length);
      const unit = prevNum && UNITS.test(core);               // "0.0 W", "3 s": a unit, upright text
      if (w.trim()) prevNum = new RegExp(`^${NUM}$`).test(core);
      if (w.trim() && core && mathWord(core) && !unit) {
        flush();
        /* letters italic (KaTeX_Math), the rest upright (KaTeX_Main) */
        for (const part of core.split(new RegExp(`(${VAR})`)).filter(Boolean)) {
          const letter = GREEK_OR_VAR.test(part) && !/^(Re|Im)$/.test(part);
          frag.appendChild(piece(inSvg, part, letter));
        }
        plain += tail;
      } else plain += w;
    }
    flush();
    p.replaceChild(frag, t);
  }

  function tidy(root) {
    const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
    const list = [];
    for (let t = w.nextNode(); t; t = w.nextNode()) if (t.data.trim()) list.push(t);
    list.forEach(tidyText);
  }

  let busy = false;
  const obs = new MutationObserver(() => {
    if (busy) return;
    busy = true; obs.disconnect();
    try { tidy(document.body); } finally {
      obs.observe(document.body, { childList: true, subtree: true, characterData: true });
      busy = false;
    }
  });
  const start = () => { tidy(document.body); obs.observe(document.body, { childList: true, subtree: true, characterData: true }); };
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", start); else start();
})();
