    $("axis").innerHTML = o + `<text x="${LW / 2}" y="40" text-anchor="middle" font-size="17" fill="#1d1d1f" style="font-family:'Source Sans 3','Source Sans Pro',system-ui,sans-serif">Test score (%)</text>`;
    $("legend").style.top = (top + 50) + "px";
    $("legend").innerHTML = `<span style="color:var(--gold)">◆</span> the contest, one fixed set of starts` + (step ? ` &nbsp;·&nbsp; <span style="color:var(--grey)">●</span> ten other starts &nbsp;·&nbsp; <span style="color:var(--pur)">●</span> mean ± one standard deviation` : "");
  }
  function lane(r) {
    let o = "";
    if (r.st) {
      o += `<g class="stat">` + r.st.v.map((x, i) => `<circle cx="${lx(x).toFixed(1)}" cy="${(ROWH / 2 + (i % 5 - 2) * 2).toFixed(1)}" r="3.2" fill="#9a9690" fill-opacity="0.55"/>`).join("");
      o += `<line x1="${lx(r.st.m - r.st.sd)}" x2="${lx(r.st.m + r.st.sd)}" y1="${ROWH / 2}" y2="${ROWH / 2}" stroke="#6a3d9a" stroke-width="4" stroke-linecap="round"/><circle cx="${lx(r.st.m)}" cy="${ROWH / 2}" r="6.5" fill="#6a3d9a" stroke="#fff" stroke-width="1.5"/></g>`;
    }
    const x = lx(r.score), d = r.first ? 9 : 7;
    return o + `<path d="M${x} ${ROWH / 2 - d} L${x + d} ${ROWH / 2} L${x} ${ROWH / 2 + d} L${x - d} ${ROWH / 2} Z" fill="#c98a00" stroke="${r.first ? "#1d1d1f" : "#fff"}" stroke-width="1.3"/>`;
  }
  function render() {
    document.body.classList.toggle("s1", step >= 1);
    ROWH = Math.max(15, Math.min(27, Math.floor(440 / Math.max(rows.length, 1))));
    document.documentElement.style.setProperty("--rh", ROWH + "px"); document.documentElement.style.setProperty("--fs", Math.min(19, ROWH - 6) + "px");
    const key = (r) => (step ? (r.st ? Math.round(10 * r.st.m) : -1) : Math.round(10 * r.score));   // the number shown, to one decimal
    const order = rows.slice().sort((a, b) => step ? (key(b) - key(a)) || (b.score - a.score) : 0);
    rows.forEach((r) => { r.pos = step ? order.indexOf(r) : r.i; });
    let place = 0, prev = null;                                  // equal numbers share a place; places count without gaps
    rows.slice().sort((a, b) => a.pos - b.pos).forEach((r) => { if (key(r) !== prev) { place++; prev = key(r); } r.place = place; });
    const box = $("rows"); box.style.height = rows.length * ROWH + "px";
    rows.forEach((r) => {
      if (!r.el) { r.el = document.createElement("div"); r.el.className = "row"; r.el.style.top = "0px"; box.appendChild(r.el); }
      r.el.classList.toggle("band", r.pos % 2 === 0); r.el.classList.toggle("top", r.place <= 3);
      r.el.style.transform = `translateY(${r.pos * ROWH}px)`;
      const num = step ? (r.st ? `${r.st.m.toFixed(1)} ± ${r.st.sd.toFixed(1)}` : (PART[r.arch.join("-")] ? "training …" : "–")) : `${r.score.toFixed(1)} %`;
      const MED = [["#d4a72c", "#fbf3d6"], ["#9aa3ab", "#eef1f3"], ["#b0703c", "#f6e7da"]][r.place - 1];
      const rank = MED ? `<svg class="medal" viewBox="0 0 24 24"><circle cx="12" cy="12" r="11" fill="${MED[0]}"/><circle cx="12" cy="12" r="8" fill="none" stroke="#fff" stroke-opacity="0.6" stroke-width="1.4"/><text x="12" y="16.5" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">${r.place}</text></svg>` : `<span class="rk">${r.place}</span>`;
      r.el.style.background = MED && r.pos % 2 ? MED[1] : (MED ? MED[1] : "");
      r.el.innerHTML = `${rank}<span class="who">${esc(r.who)}</span><span class="arch">${r.arch.length ? r.arch.join(" + ") : "none"}</span><svg class="lane" viewBox="0 0 ${LW} ${ROWH}">${lane(r)}</svg><span class="num">${num}</span>`;
    });
    $("lanehead").textContent = step ? "Ten other sets of starts for the same network" : "The contest score, from one fixed set of starts";
    $("numhead").textContent = step ? "Mean ± sd (%)" : "Contest";
    $("msg").textContent = rows.length ? "" : (DEMO ? "" : "No results yet");
    axis();
  }
  function setRows(list) {
    const old = new Map(rows.map((r) => [r.who, r]));
    rows = list.slice(0, MAXR).map((x, i) => { const r = old.get(x.who) || { who: x.who }; Object.assign(r, { i, score: +x.score, arch: archOf(x.method), first: +x.score === +list[0].score }); r.st = stats(r.arch); want(r.arch); return r; });
    old.forEach((r, k) => { if (!rows.includes(r) && r.el) r.el.remove(); });
    render();
  }
  async function load() {
    if (step) return;                                        // the order is frozen once the statistics are shown
    try { const res = await fetch(`${SERVICE}/board?contest=${encodeURIComponent(CONTEST)}`, { cache: "no-store" }); const d = await res.json(); setRows(d.rows); }
    catch (e) { $("msg").textContent = "No connection to the contest service. Retrying …"; }
  }
  function go(k) { step = Math.max(0, Math.min(1, k)); render(); if (!step) load(); }
  if (!BOARD) {
    addEventListener("message", (e) => { const d = e.data || {}; if (typeof d.animStep === "number") go(d.animStep); });
    $("app").addEventListener("click", () => go(step ? 0 : 1));
  }
  const framed = (() => { try { return window.self !== window.top; } catch (e) { return true; } })();
  if (framed) document.addEventListener("keydown", (e) => { parent.postMessage({ deckKey: e.key }, "*"); if (e.key === " ") e.preventDefault(); });
  if (DEMO) {
    const A = [[6, 7, 5], [8, 6, 8], [8, 8], [4, 7, 8], [6, 7, 7], [8, 7, 8], [8, 8, 6], [6, 6, 6, 6], [8, 6, 4, 2], [8], [6, 6], [4, 6], [4, 4, 4], [3, 4, 3]];
    const sc = { "6-7-5": 87.2, "8-6-8": 86.6, "8-8": 86.6, "4-7-8": 86.4, "6-7-7": 84.8, "8-7-8": 82.9, "8-8-6": 82.1, "6-6-6-6": 84.2, "8-6-4-2": 83.0, "8": 78.1, "6-6": 79.0, "4-6": 77.4, "4-4-4": 74.2, "3-4-3": 61.5 };
    const list = A.map((a, i) => ({ who: "demo" + String(i + 1).padStart(2, "0"), score: sc[a.join("-")], method: `layers ${a.join(" + ")}, ${a.reduce((s, x) => s + x, 0)} neurons` })).sort((a, b) => b.score - a.score);
    setRows(list);
  } else { load(); setInterval(load, 3000); }
})();
</script>
</body>
</html>
