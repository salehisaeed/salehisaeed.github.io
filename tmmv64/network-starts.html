= (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; };\n  /* Every number below is computed with + - * / and Math.sqrt only, which all browsers round the same way, so a network\n     gets the same score on every phone and laptop (Math.exp, tanh, log, cos and pow may differ in the last digit between\n     browsers, and 6000 training steps turn that into a different score). */\n  const gauss = () => { let s = -6; for (let i = 0; i < 12; i++) s += rnd(); return s; };   // near normal, variance 1\n  const LN2 = 0.6931471805599453;\n  function xexp(x) {\n    x = x > 700 ? 700 : x < -700 ? -700 : x;\n    const k = Math.round(x / LN2), r = x - k * LN2;\n    let s = 1, t = 1; for (let i = 1; i <= 14; i++) { t = t * r / i; s += t; }\n    let p = 1, b = k >= 0 ? 2 : 0.5, n = k >= 0 ? k : -k; while (n) { if (n & 1) p *= b; b *= b; n >>= 1; }\n    return s * p;\n  }\n  const xtanh = (z) => (z > 20 ? 1 : z < -20 ? -1 : (() => { const e = xexp(2 * z); return (e - 1) / (e + 1); })());\n  const xsig = (z) => 1 / (1 + xexp(-z));\n  function makeNet(sizes, k = 0) {\n    seed = 12345 + 7777 * k + SEEDBASE;                        // the same starts for the same network: a fair contest\n    const W = [], B = [];\n    for (let l = 0; l + 1 < sizes.length; l++) {\n      const m = sizes[l], n = sizes[l + 1], s = act === \"relu\" ? Math.sqrt(2 / m) : 1.4 * Math.sqrt(1 / m);\n      const w = [], b = [];\n      for (let j = 0; j < n; j++) { const r = []; for (let i = 0; i < m; i++) r.push(s * gauss()); w.push(r); b.push(act === \"relu\" && l + 2 < sizes.length ? 0.1 : 0); }\n      W.push(w); B.push(b);\n    }\n    const z = (A) => A.map((x) => (Array.isArray(x) ? z(x) : 0));\n    return { W, B, MW: z(W), VW: z(W), MB: z(B), VB: z(B), t: 0, p1: 1, p2: 1 };\n  }\n  const ACT = { tanh: [xtanh, (z, h) => 1 - h * h], relu: [(z) => (z > 0 ? z : 0), (z) => (z > 0 ? 1 : 0)] };\n  function forward(N, x) {\n    const hs = [x], zs = [];\n    for (let l = 0; l < N.W.length; l++) {\n      const h = hs[l], z = [], last = l === N.W.length - 1;\n      for (let j = 0; j < N.W[l].length; j++) { let s = N.B[l][j]; const w = N.W[l][j]; for (let i = 0; i < h.length; i++) s += w[i] * h[i]; z.push(s); }\n      zs.push(z); hs.push(last ? z.map(xsig) : z.map(ACT[act][0]));\n    }\n    return { hs, zs };\n  }\n  function trainStep(N) {\n    const gW = N.W.map((w) => w.map((r) => r.map(() => 0))), gB = N.B.map((b) => b.map(() => 0));\n    for (const [x0, x1, c] of D.train) {\n      const { hs, zs } = forward(N, [x0, x1]);\n      let d = [hs[hs.length - 1][0] - c];\n      for (let l = N.W.length - 1; l >= 0; l--) {\n        const h = hs[l];\n        for (let j = 0; j < d.length; j++) { gB[l][j] += d[j]; for (let i = 0; i < h.length; i++) gW[l][j][i] += d[j] * h[i]; }\n        if (l > 0) { const nd = []; for (let i = 0; i < h.length; i++) { let s = 0; for (let j = 0; j < d.length; j++) s += N.W[l][j][i] * d[j]; nd.push(s * ACT[act][1](zs[l - 1][i], h[i])); } d = nd; }\n      }\n    }\n    N.t++; const n = D.train.length, b1 = 0.9, b2 = 0.999; N.p1 *= b1; N.p2 *= b2; const c1 = 1 - N.p1, c2 = 1 - N.p2;\n    const upd = (P, G, Mm, Vv) => { for (let a = 0; a < P.length; a++) { const gg = G[a] / n; Mm[a] = b1 * Mm[a] + (1 - b1) * gg; Vv[a] = b2 * Vv[a] + (1 - b2) * gg * gg; P[a] -= LR * (Mm[a] / c1) / (Math.sqrt(Vv[a] / c2) + 1e-8); } };\n    for (let l = 0; l < N.W.length; l++) { for (let j = 0; j < N.W[l].length; j++) upd(N.W[l][j], gW[l][j], N.MW[l][j], N.VW[l][j]); upd(N.B[l], gB[l], N.MB[l], N.VB[l]); }\n  }\n  const accuracy = (N, set) => { let k = 0; for (const [x0, x1, c] of set) if ((forward(N, [x0, x1]).hs.slice(-1)[0][0] > 0.5) === (c > 0.5)) k++; return k / set.length; };\n\nconst pct = (v) => Math.round(1000 * v) / 10;\nonmessage = (e) => { const { arch, base, j } = e.data; SEEDBASE = base; const sizes = [2, ...arch, 1], nets = [];\n  for (let k = 0; k < STARTS; k++) { const N = makeNet(sizes, k); for (let s = 0; s < STEPS; s++) trainStep(N); nets.push(N); }\n   const SERVICE = "https://tmmv64-contest.salehi144.workers.dev", CONTEST = "L6 network builder";
  const Q = new URLSearchParams(location.search), DEMO = Q.has("demo"), BOARD = Q.has("board");   // ?board: the leaderboard only, no statistics, no click
  const $ = (id) => document.getElementById(id), NS = "http://www.w3.org/2000/svg";
  const W = 1240, H = 560, MAXR = 30, X0 = 60, X1 = 92, LW = 740;
  let ROWH = 27;                                               // smaller when many students, so all of them fit
  function fit() { const s = Math.min(innerWidth / W, innerHeight / H); $("app").style.transform = `translate(${(innerWidth - W * s) / 2}px, 0) scale(${s})`; }
  addEventListener("resize", fit); fit();
  const lx = (v) => Math.max(0, Math.min(LW, (v - X0) / (X1 - X0) * LW));
  const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const archOf = (m) => { const g = /layers ([\d +]+),/.exec(m || ""); return g ? g[1].split("+").map((x) => +x.trim()) : []; };
  const stats = (a) => { const v = T[a.join("-")] || LIVE[a.join("-")]; if (!v) return null; const m = v.reduce((s, x) => s + x, 0) / v.length;
    return { v, m, sd: Math.sqrt(v.reduce((s, x) => s + (x - m) ** 2, 0) / v.length) }; };
  let step = 0, rows = [];

  const LIVE = {}, PART = {}, queue = [], busy = new Set();
  const NW = Math.max(1, Math.min(8, (navigator.hardwareConcurrency || 4) - 1));
  const url = URL.createObjectURL(new Blob([WORKER], { type: "text/javascript" }));
  const pool = Array.from({ length: NW }, () => { const w = new Worker(url); w.idle = true; w.onmessage = (e) => done(w, e.data); return w; });
  function want(a) { const key = a.join("-"); if (!a.length || T[key] || LIVE[key] || PART[key]) return; PART[key] = []; for (const j of OTHERS) queue.push([a, j]); pump(); }
  function pump() { for (const w of pool) if (w.idle && queue.length) { const [a, j] = queue.shift(); w.idle = false; w.postMessage({ arch: a, base: 1000003 * j, j: OTHERS.indexOf(j) }); } }

    if (PART[key].filter((x) => x !== undefined).length === OTHERS.length) { LIVE[key] = PART[key]; rows.forEach((r) => { if (r.arch.join("-") === key) r.st = stats(r.arch); }); render(); }
    pump(); }
  function axis() {
    const top = 36 + Math.max(rows.length, 1) * ROWH + 4; $("axis").style.top = top + "px";
    let o = `<line x1="0" x2="${LW}" y1="0" y2="0" stroke="#9a968c"/>`;
    for (let v = 60; v <= 90; v += 5) o += `<line x1="${lx(v)}" x2="${lx(v)}" y1="0" y2="6" stroke="#9a968c"/><text x="${lx(v)}" y="24" text-anchor="middle" font-size="17" fill="#6b6e73">${v}</text>`;
    $("axis").innerHTML = o + `<text x="${LW / 2}" y="40" text-anchor="middle" font-size="17" fill="#1d1d1f" style="font-family:'Source Sans 3','Source Sans Pro',system-ui,sans-serif">Test score (%)</text>`;
    $("legend").style.top = (top + 50) + "px";
    $("legend").innerHTML = `<span style="color:var(--gold)">◆</span> the contest: one training, the contest's seed` + (step ? ` &nbsp;·&nbsp; <span style="color:var(--grey)">●</span> ten other trainings, other seeds &nbsp;·&nbsp; <span style="color:var(--pur)">●</span> mean ± one standard deviation` : "");
  }
  function lane(r) {
    let o = "";
    if (r.st) {
      o += `<g class="stat">` + r.st.v.map((x, i) => `<circle cx="${lx(x).toFixed(1)}" cy="${(ROWH / 2 + (i % 5 - 2) * 2).toFixed(1)}" r="3.2" fill="#9a9690" fill-opacity="0.55"/>`).join("");
      o += `<line x1="${lx(r.st.m - r.st.sd)}" x2="${lx(r.st.m + r.st.sd)}" y1="${ROWH / 2}" y2="${ROWH / 2}" stroke="#6a3d9a" stroke-width="4" stroke-linecap="round"/><circle cx="${lx(r.st.m)}" cy="${ROWH / 2}" r="6.5" fill="#6a3d9a" stroke="#fff" stroke-width="1.5"/></g>`;
    }
    const x = lx(r.score), d = r.first ? 9 : 7;
    return o + `<path d="M${x} ${ROWH / 2 - d} L${x + d} ${ROWH / 2} L${x} ${ROWH / 2 + d} L${x - d} ${ROWH / 2} Z" fill="#c98a00" stroke="${r.first ? "#1d1d1f" : "#fff"}" stroke-width="1.3"/>`;
  }
  function render() {
    document.body.classList.toggle("s1", step >= 1);
    ROWH = Math.max(15, Math.min(27, Math.floor(440 / Math.max(rows.length, 1))));

    const key = (r) => (step ? (r.st ? Math.round(10 * r.st.m) : -1) : Math.round(10 * r.score));   // the number shown, to one decimal
    const order = rows.slice().sort((a, b) => step ? (key(b) - key(a)) || (b.score - a.score) : 0);

    rows.forEach((r) => {
      if (!r.el) { r.el = document.createElement("div"); r.el.className = "row"; r.el.style.top = "0px"; box.appendChild(r.el); }

      const MED = [["#d4a72c", "#fbf3d6"], ["#9aa3ab", "#eef1f3"], ["#b0703c", "#f6e7da"]][r.place - 1];
      const rank = MED ? `<svg class="medal" viewBox="0 0 24 24"><circle cx="12" cy="12" r="11" fill="${MED[0]}"/><circle cx="12" cy="12" r="8" fill="none" stroke="#fff" stroke-opacity="0.6" stroke-width="1.4"/><text x="12" y="16.5" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">${r.place}</text></svg>` : `<span class="rk">${r.place}</span>`;
      r.el.style.background = MED && r.pos % 2 ? MED[1] : (MED ? MED[1] : "");
      r.el.innerHTML = `${rank}<span class="who">${esc(r.who)}</span><span class="arch">${r.arch.length ? r.arch.join(" + ") : "none"}</span><svg class="lane" viewBox="0 0 ${LW} ${ROWH}">${lane(r)}</svg><span class="num">${num}</span>`;

    old.forEach((r, k) => { if (!rows.includes(r) && r.el) r.el.remove(); });

  async function load() {
