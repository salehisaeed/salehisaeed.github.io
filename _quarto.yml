project:
  type: website
  output-dir: docs
  # Regenerates the publication lists from Pubs.bib before every render.
  pre-render: scripts/build_publications.py
  # Canonical URLs, home-page title and h1, noindex on redirects (see script).
  post-render: scripts/postrender.py
  resources:
    - CNAME
    - robots.txt
    - img/
    - files/
  render:
    - "*.qmd"

website:
  title: "Saeed Salehi"
  description: "Saeed Salehi is Associate Professor of Fluid Mechanics at Linköping University, working on computational fluid dynamics, data-driven methods and reinforcement-learning-based flow control."
  site-url: "https://saeedsalehi.com"
  favicon: img/favicon.png
  image: img/saeed-salehi.jpg
  google-analytics: "G-Y03H51EZR6"
  open-graph:
    locale: en_GB
    site-name: "Saeed Salehi"
  twitter-card:
    card-style: summary
  search:
    location: navbar
    type: overlay
  page-navigation: false
  back-to-top-navigation: false
  navbar:
    logo: img/logo.png
    logo-alt: "Saeed Salehi logo"
    title: "Saeed Salehi"
    collapse-below: lg
    right:
      - text: "Research"
        href: research.qmd
      - text: "Publications"
        href: publications.qmd
      - text: "Software"
        href: software.qmd
      - text: "Teaching"
        href: teaching.qmd
      - text: "Opportunities"
        href: opportunities.qmd
      - text: "CV"
        href: cv.qmd
      - text: "Contact"
        href: contact.qmd
  page-footer:
    left: "© Saeed Salehi · Linköping University"
    right:
      - icon: envelope
        href: mailto:saeed.salehi@liu.se
        aria-label: Email
      - icon: mortarboard
        href: "https://scholar.google.com/citations?user=6bn6bn0AAAAJ&hl=en"
        aria-label: Google Scholar
      - icon: github
        href: "https://github.com/salehisaeed"
        aria-label: GitHub
      - icon: linkedin
        href: "https://www.linkedin.com/in/saeed-salehi-3b97685a/"
        aria-label: LinkedIn

format:
  html:
    theme:
      light: [cosmo, theme.scss]
      dark: [cosmo, theme.scss, theme-dark.scss]
    respect-user-color-scheme: true
    toc: false
    toc-title: "On this page"
    anchor-sections: true
    smooth-scroll: false
    link-external-newwindow: false
    fig-cap-location: bottom
    lang: en
    include-in-header:
      - text: |
          <link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
